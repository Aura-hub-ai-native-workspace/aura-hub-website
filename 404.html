<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Page not found — AURA Hub</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/png" href="assets/brand/aura-logo.png" />
<style>
  :root {
    --canvas: #08090c; --text: #f2f3f7; --text-muted: #9aa2b8; --line-strong: #2a2f40;
    --accent: #5c86ff; --accent-2: #8b6fff;
    --font-body: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--canvas); color: var(--text); font-family: var(--font-body);
    text-align: center; padding: 32px;
  }
  .mark { width: 40px; height: 40px; object-fit: contain; margin-bottom: 28px; }
  h1 {
    font-size: 96px; line-height: 1; font-weight: 700; letter-spacing: -0.03em; margin: 0 0 12px;
    background: linear-gradient(100deg, var(--accent), var(--accent-2)); -webkit-background-clip: text;
    background-clip: text; color: transparent;
  }
  p { color: var(--text-muted); font-size: 16px; margin: 0 0 32px; }
  a.home {
    display: inline-flex; align-items: center; gap: 8px; padding: 14px 26px; border-radius: 100px;
    background: var(--text); color: var(--canvas); font-size: 14.5px; font-weight: 650; text-decoration: none;
    transition: transform 0.25s cubic-bezier(0.16,1,0.3,1);
  }
  a.home:hover { transform: translateY(-2px); }
</style>
</head>
<body>
  <div>
    <img class="mark" src="assets/brand/aura-logo.png" alt="AURA" />
    <h1>404</h1>
    <p>This page doesn't exist.</p>
    <a class="home" href="/">Back to AURA Hub</a>
  </div>
</body>
</html>
